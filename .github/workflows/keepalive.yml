# Keeps the free Render instance awake so Alexa (which waits ~8 seconds) never hits a cold start.
# One always-on free service fits within Render's 750 free instance hours per month.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://scamshield-alexa.onrender.com/health
