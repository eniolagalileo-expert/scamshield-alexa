# Keeps the free Render instance awake so Alexa (which waits ~8 seconds) never hits a cold start.
# One always-on free service fits within Render's 750 free instance hours per month.
# GitHub delays scheduled runs (often 30+ minutes, sometimes hours), longer than Render's
# 15-minute idle timeout, so each run keeps pinging for most of the 6-hour job limit and the
# concurrency group queues the next run behind it.
name: Keep demo awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping health endpoint every 10 minutes
        run: |
          for i in $(seq 1 34); do
            curl --silent --show-error --max-time 90 --retry 2 -o /dev/null -w "%{http_code} %{time_total}s\n" https://scamshield-alexa.onrender.com/health || true
            sleep 600
          done
